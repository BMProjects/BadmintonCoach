# Real singles broadcast clip (assets/sample_singles.mp4, 1920x1080@25fps).
# Uses real backends: YOLOv8 person detection (filtered to court) + RTMPose +
# TrackNetV3 + MonoTrack 3D. Court uses MANUAL approximate corners because the
# classical auto-detector (keypoint) is fooled by broadcast graphics — see the
# diagnosis notes. Replace image_corners with a learned-detector output later.
name: singles

io:
  clip_window: 8           # == TrackNet seq_len
  stride: 1
  max_frames: null

perception:
  filter_players_to_court: true   # drop umpire/line-judges/audience, keep 2 players
  max_players: 2
  court_margin_m: 2.0
  court_per_frame_presence: true  # only draw court on frames where it's detected (no phantom)

  detector:
    backend: yolo            # Ultralytics YOLO (latest)
    device: cuda
    weights: yolo26n.pt      # YOLO26 (2026, NMS-free); auto-downloads. COCO 'person' = 0
    threshold: 0.3
    class_map:
      0: player
  shuttle_tracker:
    backend: tracknetv3
    device: cuda
    weights: weights/ckpts/TrackNet_best.pt
  pose_estimator:
    backend: yolo_pose       # YOLO26-pose (native COCO-17); keeps pipeline on YOLO/torch
    device: cuda
    weights: yolo26n-pose.pt
    threshold: 0.3
  player_tracker:
    backend: iou
    device: cuda
  court_calibrator:
    backend: line_heatmap    # named line-heatmap + intersection (efficientvit_b1); standard-court model
    device: cuda
    weights: weights/court_lines_evit_b1.pt
    world_map: weights/court_kp_official_world.json
    decode: robust
    threshold: 0.3
    compute_camera: true
    focal_px: null
    # false-positive control: reject no-court / incomplete-court frames rather than
    # produce a wrong 3D mapping (see line_heatmap backend gates)
    min_overlap: 0.30        # reprojected court must overlap real white lines
    min_observed: 10         # need >=10 confident keypoints inside the frame
  reconstructor:
    backend: monotrack
    device: cuda
    enabled: true
    fps: 25.0
